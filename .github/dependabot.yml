# Dependency updates for the published cachet-setup action.
#
# This repository is the public, released copy of the action; its canonical source is agx-runtime/cachet
# under action/, and a change there is copied here (the header in action.yml explains why). Cachet's own
# Dependabot already watches those manifests, so this config is the safety net that catches a reference
# here going stale if a sync ever lags. A bump opened here is reconciled by re-syncing from cachet rather
# than merged on its own, or the two copies drift.
version: 2

updates:
  # The actions this action's manifest references, chiefly DeterminateSystems/determinate-nix-action.
  # Pinned to a major tag, so a pull request here is a new major that needs reading rather than merging.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
